<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OrderStream</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;background:#0f172a;color:#e2e8f0}
  main{max-width:900px;margin:0 auto;padding:24px}
  h1{margin:0 0 4px} .sub{color:#94a3b8;margin-bottom:20px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
  .card{background:#1e293b;border-radius:10px;padding:14px}
  .card b{display:block;font-size:1.5rem} .card span{color:#94a3b8;font-size:.85rem}
  form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
  input,button{padding:9px 12px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:inherit}
  button{background:#3b82f6;border-color:#3b82f6;cursor:pointer}
  table{width:100%;border-collapse:collapse;background:#1e293b;border-radius:10px;overflow:hidden}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid #334155;font-size:.9rem}
  th{color:#94a3b8;font-weight:500} .wrap{overflow-x:auto}
  #msg{color:#94a3b8;margin-bottom:12px;min-height:1.2em}
</style>
</head>
<body>
<main>
  <h1>OrderStream</h1>
  <div class="sub">API &rarr; Kafka (orders, 2 partitions) &rarr; consumer group &rarr; SQLite</div>
  <div class="cards">
    <div class="card"><b id="total">0</b><span>orders processed</span></div>
    <div class="card"><b id="rev">0</b><span>total revenue (&#8377;)</span></div>
    <div class="card"><b id="parts">-</b><span>orders per partition</span></div>
  </div>
  <form id="f">
    <input id="user" value="U-101" placeholder="user id" required>
    <input id="amount" type="number" min="1" step="0.01" value="1499" required>
    <input id="items" value="Keyboard, Mouse" required>
    <button>Send order</button>
  </form>
  <div id="msg"></div>
  <div class="wrap"><table>
    <thead><tr><th>Order</th><th>User</th><th>Amount</th><th>Status</th><th>Partition</th><th>Offset</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</main>
<script>
const $ = id => document.getElementById(id);
async function refresh(){
  try{
    const [orders, st] = await Promise.all([fetch('/orders?limit=15').then(r=>r.json()), fetch('/stats').then(r=>r.json())]);
    $('total').textContent = st.total_orders;
    $('rev').textContent = st.total_revenue.toLocaleString('en-IN');
    $('parts').textContent = Object.entries(st.by_partition).map(([p,c])=>'P'+p+': '+c).join('  ') || '-';
    $('rows').innerHTML = orders.map(o=>`<tr><td>${o.order_id}</td><td>${o.user_id}</td><td>${o.amount}</td><td>${o.status}</td><td>${o.kafka_partition}</td><td>${o.kafka_offset}</td></tr>`).join('');
  }catch(e){}
}
$('f').addEventListener('submit', async e=>{
  e.preventDefault();
  const body = {user_id:$('user').value, amount:parseFloat($('amount').value), items:$('items').value.split(',').map(s=>s.trim()).filter(Boolean)};
  const r = await fetch('/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j = await r.json();
  $('msg').textContent = r.ok ? `Published ${j.order_id} to partition ${j.kafka.partition}, offset ${j.kafka.offset}` : 'Error: '+JSON.stringify(j.detail);
  setTimeout(refresh, 600);
});
refresh(); setInterval(refresh, 2000);
</script>
</body>
</html>
